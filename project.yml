name: MilesProSync
options:
  bundleIdPrefix: com.aisleweb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
targets:
  MilesProSync:
    type: application
    platform: iOS
    sources:
      - path: MilesProSync
        excludes:
          - Info.plist
      # Bundled so Settings shows the same policy text that's published.
      - path: PRIVACY.md
        buildPhase: resources
    info:
      path: MilesProSync/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: Miles Pro Sync
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "16"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "Miles Pro Sync uses your location to detect when you start and finish driving so it can automatically log your trips."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Miles Pro Sync needs access to your location in the background to automatically detect and record your drives, even when the app isn't open."
        NSMotionUsageDescription: "Miles Pro Sync uses motion data to detect when you're driving so it can automatically start and stop trip recording."
        UIBackgroundModes:
          - location
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.aisleweb.MilesProSync.sync
        SyncAPIURL: $(SYNC_API_URL)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aisleweb.MilesProSync
        DEVELOPMENT_TEAM: 94PVULJP4W
        PRODUCT_NAME: MilesProSync
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: true
        # Cloud sync: the website's https:// origin, whose API the app uploads to (the app appends
        # api/v1/... itself; see website/README.md). Leave empty to build without sync. The app holds
        # no database credentials; only the server connects to the database.
        SYNC_API_URL: "https://milesprosync.com"
    entitlements:
      path: MilesProSync/MilesProSync.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: ZIPFoundation
  MilesProSyncTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MilesProSyncTests
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: MilesProSync
schemes:
  MilesProSync:
    build:
      targets:
        MilesProSync: all
        MilesProSyncTests: [test]
    run:
      config: Debug
      # Local purchases for testing plans and expiry; used by Run only, never by Archive.
      storeKitConfiguration: MilesProSync.storekit
    test:
      config: Debug
      targets:
        - MilesProSyncTests
    archive:
      config: Release
